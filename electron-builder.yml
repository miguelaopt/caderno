appId: pt.caderno.desktop
productName: Caderno
directories:
  output: release
files:
  - desktop/**
  - lib/**
  - scripts/product.mjs
  - web/**
  - package.json
asar: true
win:
  icon: web/icon.ico
  target:
    - target: nsis
      arch:
        - x64
  artifactName: Caderno-${version}-Windows-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  runAfterFinish: true
# Gera latest.yml e app-update.yml para as atualizações automáticas (electron-updater).
# O upload é feito pelo workflow Windows desktop, não pelo electron-builder.
publish:
  provider: github
  owner: miguelaopt
  repo: caderno
